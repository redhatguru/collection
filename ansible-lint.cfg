# ansible-lint configuration
# Run explicitly with: ansible-lint -c ansible-lint.cfg
# (ansible-lint config files are YAML regardless of file extension)

profile: production

exclude_paths:
  - .github/
  - .ansible/
  - changelogs/
  - docs/

# Fail the run on warnings too, not just errors
strict: true

# Show full paths and rule descriptions to make CI output actionable
quiet: false
