---
# Example playbook for the pxeboot role.
#
# Inventory:
#   [pxe_server]
#   pxe-server-01
- name: Deploy a PXE boot server
  hosts: pxe_server
  become: true
  vars:
    # An address within the subnet PXE clients boot from (proxy-DHCP
    # mode — no leases are handed out, so this can run alongside an
    # existing DHCP server).
    pxeboot_dhcp_proxy_address: "10.0.0.50"

  tasks:
    - name: PXE boot server
      ansible.builtin.include_role:
        name: redhatguru.general.pxeboot
