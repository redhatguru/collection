---
# One GitLab per host. Several hosts in this group means several independent
# instances, not a cluster — the role builds a single-node Omnibus install.
all:
  children:
    gitlab_servers:
      hosts:
        gitlab-01:
          ansible_host: 10.10.60.10

    # One runner per host; more capacity means more hosts here.
    gitlab_runners:
      hosts:
        gitlab-runner-01:
          ansible_host: 10.10.60.20
