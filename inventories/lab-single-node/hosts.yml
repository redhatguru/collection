---
# Single node: one control-plane host, no workers. The role derives
# k3s_topology == 'single-node' from this and sizes Traefik to one
# replica without a PodDisruptionBudget.
all:
  children:
    k8s_control_plane:
      hosts:
        k8s-01:
          ansible_host: 10.10.50.10

    # Present but empty. Leaving the group out entirely works too; defining it
    # keeps the inventory shape identical to the HA example.
    k8s_workers:
      hosts: {}
