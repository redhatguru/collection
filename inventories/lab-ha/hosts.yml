---
# HA control plane with a dedicated worker: three control-plane nodes forming
# an embedded-etcd quorum, plus one worker. The role derives
# k3s_topology == 'ha' from this, sizes Traefik to three replicas and
# spreads them over separate nodes.
#
# Three is the smallest number that gives a quorum. Two would be worse than
# one: the quorum becomes 2, so losing either node stops the cluster — the
# role refuses that configuration outright.
all:
  children:
    k8s_control_plane:
      hosts:
        k8s-01:
          ansible_host: 10.10.50.11
        k8s-02:
          ansible_host: 10.10.50.12
        k8s-03:
          ansible_host: 10.10.50.13

    k8s_workers:
      hosts:
        k8s-04:
          ansible_host: 10.10.50.14
