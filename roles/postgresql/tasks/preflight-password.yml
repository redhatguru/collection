---
- name: "ALL | Ensure the postgres superuser password is a real one"
  ansible.builtin.assert:
    that:
      - postgresql_root_password | length > 0
      - postgresql_root_password not in postgresql_password_placeholders
    fail_msg: >-
      postgresql_root_password is empty or still a placeholder, and that
      placeholder is in a public repository. Keep the real one in Ansible Vault:
      `ansible-vault encrypt_string --name vault_postgresql_root_password '<value>'`.
    quiet: true
