---
- name: "DEBIAN | Ensure the PostgreSQL package repository is available"
  ansible.builtin.import_tasks: repository-Debian.yml

- name: "DEBIAN | Ensure the PostgreSQL packages are installed and held"
  ansible.builtin.import_tasks: packages-Debian.yml

- name: "DEBIAN | Ensure PostgreSQL is enabled and running"
  ansible.builtin.systemd_service:
    name: "{{ postgresql_service_name }}"
    state: started
    enabled: true
  become: true
