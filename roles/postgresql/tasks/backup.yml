---
- name: "ALL | Ensure the backup directory exists and is private"
  ansible.builtin.file:
    path: "{{ postgresql_backup_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  become: true

# --compress rather than a pipe to gzip: /bin/sh has no pipefail, so a failing
# pg_dump would leave an empty archive and a job that reports success. In
# /etc/cron.d because the postgres account isn't allowed to run crontab itself.
- name: "ALL | Ensure every database has a scheduled pg_dump backup"
  ansible.builtin.cron:
    name: "PostgreSQL backup of {{ item }}"
    cron_file: "postgresql-backup-{{ item }}"
    user: postgres
    minute: "{{ postgresql_backup_minute }}"
    hour: "{{ postgresql_backup_hour }}"
    day: "{{ postgresql_backup_day }}"
    month: "{{ postgresql_backup_month }}"
    weekday: "{{ postgresql_backup_weekday }}"
    job: >-
      {{ postgresql_bin_dir }}/pg_dump --port={{ postgresql_port }} --compress=6
      --file={{ postgresql_backup_dir }}/{{ item }}_$(date +\%Y\%m\%d\%H\%M\%S).sql.gz {{ item }}
  become: true
  loop: "{{ postgresql_databases | map(attribute='name') | list }}"

- name: "ALL | Ensure old backups are pruned"
  ansible.builtin.cron:
    name: "PostgreSQL backup retention for {{ item }}"
    cron_file: "postgresql-backup-{{ item }}"
    user: postgres
    minute: "30"
    hour: "{{ postgresql_backup_hour }}"
    job: >-
      find {{ postgresql_backup_dir }} -maxdepth 1 -type f -name '{{ item }}_*.sql.gz'
      -mtime +{{ postgresql_backup_keep_days | int }} -delete
    state: "{{ 'present' if postgresql_backup_keep_days | int > 0 else 'absent' }}"
  become: true
  loop: "{{ postgresql_databases | map(attribute='name') | list }}"
