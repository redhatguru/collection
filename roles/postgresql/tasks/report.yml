---
- name: "ALL | Print the database report"
  ansible.builtin.debug:
    msg: >-
      {{ item.name }}: users {{ item.users | map(attribute='user') | join(', ') }};
      extensions {{ item.plugins | default([], true) | join(', ') | default('none', true) }}
  loop: "{{ postgresql_databases }}"
  loop_control:
    label: "{{ item.name }}"
