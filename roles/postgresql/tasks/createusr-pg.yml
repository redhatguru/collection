---
- name: "ALL | Ensure the database users exist with their configured passwords"
  community.postgresql.postgresql_user:
    name: "{{ item.user }}"
    password: "{{ item.password }}"
    port: "{{ postgresql_port | int }}"
    state: present
  become: true
  become_user: postgres
  loop: "{{ postgresql_database_users }}"
  loop_control:
    label: "{{ item.user | default('unnamed') }}"
  no_log: "{{ postgresql_no_log | bool }}"
