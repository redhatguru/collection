---
# tasks for install and create postgress database
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - gnupg
      - ca-certificates
      - python3-psycopg2
      - acl
    state: present
    update_cache: true
  become: true

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Add PostgreSQL apt signing key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/postgresql.asc
    mode: '0644'
  become: true

- name: Add PostgreSQL apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/postgresql.asc]
      https://apt.postgresql.org/pub/repos/apt
      {{ ansible_facts['distribution_release'] }}-pgdg main
    filename: pgdg
    state: present
  become: true

- name: Install PostgreSQL {{ postgresql_version }}
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - "postgresql-contrib-{{ postgresql_version }}"
    state: present
    update_cache: true
  become: true

- name: Open ufw port for PostgreSQL
  community.general.ufw:
    rule: allow
    port: "{{ postgresql_port }}"
    proto: tcp
    from_ip: "{{ postgresql_allow_subnet }}"
  become: true
  when: ansible_facts['virtualization_type'] != 'docker'

- name: Ensure PostgreSQL service is running
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
  become: true
...
