---
# The whole of it: the server, then whatever postgresql_databases asks for.
# playbooks/postgresql-install.yml and playbooks/postgresql-databases.yml run
# one half each.
- name: "ALL | Ensure PostgreSQL is installed and configured"
  ansible.builtin.import_tasks: server.yml

- name: "ALL | Ensure the databases, their users and their extensions exist"
  ansible.builtin.import_tasks: databases.yml
  when: postgresql_databases | length > 0
