---
- name: "ALL | Install Postgress"
  ansible.builtin.import_tasks:
    file: install-pg.yml
  tags: install

- name: "ALL | Create Postgress Database"
  ansible.builtin.import_tasks:
    file: createdb-pg.yml
  tags: createdb

- name: "ALL | Create Postgres Users"
  ansible.builtin.import_tasks:
    file: createusr-pg.yml
  tags: createusr

- name: "ALL | Harden Postgres"
  ansible.builtin.import_tasks:
    file: hardening.yml
  tags: hardening

- name: "ALL | Configure automatic PostgreSQL backups"
  ansible.builtin.import_tasks:
    file: backup.yml
  tags: backup

- name: "ALL | Print database report"
  ansible.builtin.import_tasks:
    file: report.yml
  tags: report
...
