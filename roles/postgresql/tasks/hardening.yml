---
- name: "ALL | Ensure the configuration files match the role's variables"
  ansible.builtin.import_tasks: configure.yml

# Flushed here because everything below logs in to the server, on the port this
# run may just have changed.
- name: "ALL | Apply any pending restart before using the server"
  ansible.builtin.meta: flush_handlers

- name: "ALL | Ensure the postgres superuser has the configured password"
  community.postgresql.postgresql_user:
    name: postgres
    password: "{{ postgresql_root_password }}"
    port: "{{ postgresql_port | int }}"
  become: true
  become_user: postgres
  no_log: "{{ postgresql_no_log | bool }}"
