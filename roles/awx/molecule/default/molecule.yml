---
dependency:
  name: galaxy
driver:
  name: vagrant
  parallel: false
  provider:
    name: virtualbox
platforms:
  - name: k8s
    box: bento/ubuntu-26.04
    memory: 12288
    cpus: 6
    groups:
      - single
    interfaces:
      - network_name: private_network
        ip: 10.10.14.11
    instance_raw_config_args:
      - "vm.boot_timeout = 600"
    config_options:
      ssh.insert_key: false
  - name: postgres
    box: bento/ubuntu-26.04
    memory: 2048
    cpus: 2
    groups:
      - postgresql
    interfaces:
      - network_name: private_network
        ip: 10.10.14.12
    instance_raw_config_args:
      - "vm.boot_timeout = 600"
    config_options:
      ssh.insert_key: false
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  playbooks:
    prepare: prepare.yml
verifier:
  name: ansible
ansible:
  cfg:
    ssh_connection:
      retries: 5
    defaults:
      timeout: 30
