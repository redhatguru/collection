---
- name: Deploy AWX
  kubernetes.core.k8s:
    kubeconfig: /etc/kubernetes/admin.conf
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'awx-instance.yaml.j2') }}"
  become: true

- name: Wait for the AWX Operator to create the AWX deployments
  # The operator creates "<name>-web"/"<name>-task" asynchronously after
  # the AWX custom resource is applied (and only after the migration job
  # it runs first completes), so existence has to be polled for separately
  # before waiting on a condition makes sense.
  kubernetes.core.k8s_info:
    kubeconfig: /etc/kubernetes/admin.conf
    api_version: apps/v1
    kind: Deployment
    name: "{{ awx_name }}-{{ item }}"
    namespace: "{{ awx_namespace }}"
  become: true
  register: awx_deployment_exists
  retries: 60
  delay: 10
  until: awx_deployment_exists.resources | length > 0
  loop:
    - web
    - task

- name: Wait for the AWX deployments to become available
  kubernetes.core.k8s:
    kubeconfig: /etc/kubernetes/admin.conf
    api_version: apps/v1
    kind: Deployment
    name: "{{ awx_name }}-{{ item }}"
    namespace: "{{ awx_namespace }}"
    state: present
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: "{{ awx_wait_timeout }}"
  become: true
  loop:
    - web
    - task
