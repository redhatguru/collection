---
# RedHat-family hosts have no rules here: firewalld is disabled outright
# on them (see install-RedHat.yml) because it conflicts with Calico, so
# there's no firewall to open these ports on in the first place.
- name: Allow the API server from the public internet (ufw)
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Allow the dashboard NodePort from the public internet (ufw)
  community.general.ufw:
    rule: allow
    port: "{{ kubernetes_dashboard_node_port }}"
    proto: tcp
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - kubernetes_dashboard_enabled | bool

- name: Allow the ingress-nginx NodePorts from the public internet (ufw)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  become: true
  loop:
    - "{{ kubernetes_ingress_http_node_port }}"
    - "{{ kubernetes_ingress_https_node_port }}"
  when:
    - ansible_facts['os_family'] == 'Debian'
    - kubernetes_ingress_enabled | bool
