---
# Materialized into a real fact (rather than left as a live-templated
# default) so other hosts can read it reliably via hostvars, e.g. when
# masters/workers resolve kubernetes_control_plane_endpoint.
- name: Materialize the node's advertise/join IP as a fact
  ansible.builtin.set_fact:
    kubernetes_node_ip: "{{ kubernetes_node_ip }}"

- name: Prepare host for Kubernetes
  ansible.builtin.include_tasks: prerequisites.yml
  tags: prerequisites

- name: Install container runtime and Kubernetes packages
  ansible.builtin.include_tasks: "install-{{ ansible_facts['os_family'] }}.yml"
  tags: install

- name: Bootstrap single-node cluster
  ansible.builtin.include_tasks: single.yml
  tags: cluster
  when: inventory_hostname in (groups['single'] | default([]))

- name: Bootstrap masters/workers cluster (masters)
  ansible.builtin.include_tasks: masters.yml
  tags: cluster
  when: inventory_hostname in (groups['masters'] | default([]))

- name: Bootstrap masters/workers cluster (workers)
  ansible.builtin.include_tasks: workers.yml
  tags: cluster
  when: inventory_hostname in (groups['workers'] | default([]))

- name: Tune etcd/kube-apiserver for slow disks
  ansible.builtin.include_tasks: etcd-tuning.yml
  tags: etcd-tuning
  when: (inventory_hostname in (groups['single'] | default([]))) or
    (inventory_hostname in (groups['masters'] | default([])))

- name: Set up a floating VIP across the masters
  ansible.builtin.include_tasks: vip.yml
  tags: vip
  when:
    - kubernetes_vip_enabled | bool
    - inventory_hostname in (groups['masters'] | default([]))

- name: Install the ingress-nginx controller
  ansible.builtin.include_tasks: ingress.yml
  tags: ingress
  when:
    - kubernetes_ingress_enabled | bool
    - (inventory_hostname in (groups['single'] | default([]))) or
      (inventory_hostname == (groups['masters'] | default([]) | first | default('')))

- name: Install Kubernetes Dashboard
  ansible.builtin.include_tasks: dashboard.yml
  tags: dashboard
  when:
    - kubernetes_dashboard_enabled | bool
    - (inventory_hostname in (groups['single'] | default([]))) or
      (inventory_hostname == (groups['masters'] | default([]) | first | default('')))

- name: Apply cluster hardening
  ansible.builtin.include_tasks: hardening.yml
  tags: hardening
  when:
    - kubernetes_hardening_enabled | bool
    - (inventory_hostname in (groups['single'] | default([]))) or
      (inventory_hostname == (groups['masters'] | default([]) | first | default('')))

- name: Open control-plane ports to the public internet
  ansible.builtin.include_tasks: firewall-public.yml
  tags: firewall
  when:
    - kubernetes_public_access_enabled | bool
    - (inventory_hostname in (groups['single'] | default([]))) or
      (inventory_hostname in (groups['masters'] | default([])))

- name: Print cluster report
  ansible.builtin.include_tasks: report.yml
  tags: report
  when:
    - (inventory_hostname in (groups['single'] | default([]))) or
      (inventory_hostname == (groups['masters'] | default([]) | first | default('')))

# Opt-in only: never runs as part of a normal play, only when explicitly
# requested with --tags upgrade. See tasks/upgrade.yml and the README for
# how to run this as a true rolling upgrade (one node at a time).
- name: Perform a rolling upgrade
  ansible.builtin.include_tasks: upgrade.yml
  tags: [upgrade, never]
  when: inventory_hostname in ((groups['single'] | default([])) +
    (groups['masters'] | default([])) + (groups['workers'] | default([])))
...
