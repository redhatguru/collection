---
# Checks the instance the way an operator would after an upgrade: the release
# that is serving requests, the services, the web interface, the configuration
# file, the backups that were taken along the way — and then two things the
# role is supposed to refuse.
#
# Nothing here calls the role to find out what the role did; everything is
# read back off the host.

- name: Verify the GitLab instance
  hosts: all
  gather_facts: true

  vars:
    gitlab_test_url: "http://127.0.0.1"
    gitlab_test_host: "gitlab.molecule.local"
    # Rendered by templates/gitlab.rb.j2 from resources/group_vars/all.yml.
    # Between them these cover a plain string, a number, a boolean, a quoted
    # size, a derived default and the raw-Ruby escape hatch.
    gitlab_test_expected_config:
      - "external_url \"http://gitlab.molecule.local\""
      - "gitlab_rails['time_zone'] = \"Europe/Amsterdam\""
      - "gitlab_rails['backup_path'] = \"/var/opt/gitlab/backups\""
      - "gitlab_rails['gitlab_default_theme'] = 2"
      - "gitlab_rails['gitlab_username_changing_enabled'] = false"
      - "gitlab_rails['env'] = { \"MOLECULE_TEST\" => \"true\" }"
      - "nginx['client_max_body_size'] = \"512m\""
      - "prometheus_monitoring['enable'] = false"

  tasks:
    # Everything below is checked on an instance that has just come back from
    # a reboot, which is the only honest way to test that it does. The
    # interesting failures after a reboot are the ones that look healthy:
    # nginx up with no certificate because a mount came back late, Puma up
    # before PostgreSQL, a firewall whose rules were never persisted.
    - name: Reboot the instance before checking anything
      ansible.builtin.reboot:
        reboot_timeout: 900
      become: true

    - name: Work out which release the test upgraded to
      ansible.builtin.include_tasks: tasks/discover-releases.yml

    - name: Collect the installed packages
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert the upgraded package is the release the test targeted
      ansible.builtin.assert:
        that:
          - (ansible_facts['packages']['gitlab-ce'] | first).version == gitlab_test_target_version
        fail_msg: >-
          gitlab-ce is
          {{ (ansible_facts['packages']['gitlab-ce'] | default([{}]) | first).version | default('absent') }},
          expected {{ gitlab_test_target_version }}

    - name: Read the version GitLab itself reports
      ansible.builtin.slurp:
        src: /opt/gitlab/embedded/service/gitlab-rails/VERSION
      become: true
      register: gitlab_test_version_file

    - name: Assert the application serving requests is the upgraded release
      ansible.builtin.assert:
        that:
          - gitlab_test_version_file.content | b64decode | trim
            == gitlab_test_target_version | regex_replace('-ce\.[0-9]+$', '')
        fail_msg: >-
          GitLab reports {{ gitlab_test_version_file.content | b64decode | trim }},
          expected {{ gitlab_test_target_version | regex_replace('-ce\.[0-9]+$', '') }}.
          The package was replaced but the reconfigure that applies it did not
          finish.

    - name: Collect the state of every GitLab service
      ansible.builtin.command:
        argv: [/usr/bin/gitlab-ctl, status]
      become: true
      register: gitlab_test_services
      changed_when: false

    - name: Assert every GitLab service is running
      ansible.builtin.assert:
        that:
          - gitlab_test_services.stdout_lines | select('match', '^down:') | list | length == 0
          - gitlab_test_services.stdout_lines | select('match', '^run:') | list | length >= 5
        fail_msg: "gitlab-ctl status: {{ gitlab_test_services.stdout_lines | join(' | ') }}"

    - name: Fetch the GitLab sign-in page
      ansible.builtin.uri:
        url: "{{ gitlab_test_url }}/users/sign_in"
        headers:
          Host: "{{ gitlab_test_host }}"
        return_content: true
        status_code: [200]
      register: gitlab_test_sign_in
      changed_when: false
      retries: 30
      delay: 10
      until: gitlab_test_sign_in.status | default(0) == 200

    - name: Assert the page served really is GitLab's
      ansible.builtin.assert:
        that:
          - "'GitLab' in gitlab_test_sign_in.content"
        fail_msg: "Something is listening on port 80, but it is not GitLab"

    - name: Assert GitLab reports itself ready
      ansible.builtin.uri:
        url: "{{ gitlab_test_url }}/-/readiness"
        headers:
          Host: "{{ gitlab_test_host }}"
        status_code: [200]
      changed_when: false

    - name: Read the rendered GitLab configuration
      ansible.builtin.slurp:
        src: /etc/gitlab/gitlab.rb
      become: true
      register: gitlab_test_config_file

    - name: Assert every configured setting was rendered into gitlab.rb
      ansible.builtin.assert:
        that:
          - item in gitlab_test_config_file.content | b64decode
        fail_msg: "gitlab.rb does not contain: {{ item }}"
      loop: "{{ gitlab_test_expected_config }}"
      loop_control:
        label: "{{ item }}"

    - name: Check the permissions on the GitLab credentials
      ansible.builtin.stat:
        path: "{{ item }}"
      become: true
      register: gitlab_test_credentials
      loop:
        - /etc/gitlab/gitlab.rb
        - /etc/gitlab/gitlab-secrets.json
      loop_control:
        label: "{{ item }}"

    - name: Assert the GitLab credentials are readable by root only
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode == '0600'
          - item.stat.pw_name == 'root'
        fail_msg: "{{ item.item }} is {{ item.stat.mode | default('missing') }}"
      loop: "{{ gitlab_test_credentials.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Two backups should exist by now: the one side-effect.yml took on demand,
    # and the one the upgrade took before replacing the package.
    - name: List the backup archives on the instance
      ansible.builtin.find:
        paths: /var/opt/gitlab/backups
        patterns: "*_gitlab_backup.tar"
      become: true
      register: gitlab_test_data_archives

    - name: List the configuration backup archives on the instance
      ansible.builtin.find:
        paths: /etc/gitlab/config_backup
        patterns: "gitlab_config_*.tar"
      become: true
      register: gitlab_test_config_archives

    - name: Assert both the on-demand and the pre-upgrade backups are there
      ansible.builtin.assert:
        that:
          - gitlab_test_data_archives.files | length >= 2
          - gitlab_test_config_archives.files | length >= 2
          - gitlab_test_data_archives.files | map(attribute='size') | min > 0
          - gitlab_test_config_archives.files | map(attribute='size') | min > 0
        fail_msg: >-
          Expected at least two data and two configuration archives (one pair
          from the on-demand backup, one from the pre-upgrade backup), found
          {{ gitlab_test_data_archives.files | length }} and
          {{ gitlab_test_config_archives.files | length }}.

    - name: Read back which archives the on-demand backup reported writing
      ansible.builtin.slurp:
        src: /var/tmp/molecule-backup-archives.json
      become: true
      register: gitlab_test_reported_archives

    - name: Assert the archives the role reported writing are the ones on disk
      ansible.builtin.assert:
        that:
          - gitlab_test_reported_on_demand | length == 2
          - gitlab_test_reported_on_demand | difference(gitlab_test_archives_on_disk) | length == 0
        fail_msg: >-
          The on-demand backup reported {{ gitlab_test_reported_on_demand | join(', ') }},
          which is not what is on disk:
          {{ gitlab_test_archives_on_disk | join(', ') }}
      vars:
        gitlab_test_reported_on_demand: >-
          {{ gitlab_test_reported_archives.content | b64decode | from_json }}
        gitlab_test_archives_on_disk: >-
          {{ (gitlab_test_data_archives.files + gitlab_test_config_archives.files)
             | map(attribute='path') | list }}

    - name: Check the scheduled backup jobs
      ansible.builtin.stat:
        path: "{{ item }}"
      become: true
      register: gitlab_test_cron_files
      loop:
        - /etc/cron.d/gitlab-backup
        - /etc/cron.d/gitlab-backup-config
      loop_control:
        label: "{{ item }}"

    - name: Assert both backups are scheduled
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "{{ item.item }} is missing, so that backup is not scheduled"
      loop: "{{ gitlab_test_cron_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Collect the dpkg selection for the GitLab package
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${Package} ${Status}\n", gitlab-ce]
      register: gitlab_test_dpkg_status
      changed_when: false

    - name: Assert the GitLab package is held at the installed release
      ansible.builtin.assert:
        that:
          - "'hold ok installed' in gitlab_test_dpkg_status.stdout"
        fail_msg: >-
          gitlab-ce is '{{ gitlab_test_dpkg_status.stdout | trim }}'. It should
          be held, so that unattended-upgrades cannot run a GitLab upgrade on
          its own.

    - name: Check the state of the host firewall
      ansible.builtin.command:
        argv: [ufw, status, verbose]
      become: true
      register: gitlab_test_ufw
      changed_when: false

    - name: Assert the firewall is still on and allows exactly what GitLab needs
      ansible.builtin.assert:
        that:
          - "'Status: active' in gitlab_test_ufw.stdout"
          - "'deny (incoming)' in gitlab_test_ufw.stdout"
          - "'80/tcp' in gitlab_test_ufw.stdout"
          - "'22/tcp' in gitlab_test_ufw.stdout"
          # The instance is http in this scenario, so 443 has no business
          # being open — the role derives the ports rather than opening both.
          - "'443' not in gitlab_test_ufw.stdout"
        fail_msg: "ufw status: {{ gitlab_test_ufw.stdout_lines | join(' | ') }}"

    # From the controller, over the VM's own address: the loopback checks above
    # would pass even with every port blocked, so this is the one that proves
    # the firewall lets clients in.
    - name: Fetch the sign-in page from outside the VM, through the firewall
      ansible.builtin.uri:
        url: "http://{{ gitlab_test_private_ip }}/users/sign_in"
        headers:
          Host: "{{ gitlab_test_host }}"
        return_content: true
        status_code: [200]
      delegate_to: localhost
      become: false
      register: gitlab_test_external_fetch
      changed_when: false

    - name: Assert the page reached from outside really is GitLab's
      ansible.builtin.assert:
        that:
          - "'GitLab' in gitlab_test_external_fetch.content"
        fail_msg: >-
          {{ gitlab_test_private_ip }} answered from the controller, but not
          with GitLab's sign-in page.

    # --------------------------------------------------------------------
    # What the role must refuse
    # --------------------------------------------------------------------
    #
    # A check that only ever passes proves nothing about whether it would
    # fail, so both guards are made to fail here on purpose.

    - name: Run the hardware preflight against a requirement this host cannot meet
      block:
        - name: Ask for more memory than the instance has
          ansible.builtin.include_role:
            name: gitlab
            tasks_from: preflight.yml
          vars:
            gitlab_preflight_min_memory_mb: 999999

        - name: Record that the preflight accepted the host
          ansible.builtin.set_fact:
            gitlab_test_preflight_refused: false
      rescue:
        - name: Record that the preflight refused the host
          ansible.builtin.set_fact:
            gitlab_test_preflight_refused: true

    - name: Assert the preflight refuses a host that is too small for GitLab
      ansible.builtin.assert:
        that:
          - gitlab_test_preflight_refused | bool
        fail_msg: >-
          The preflight checks passed on a host asked to provide 999999 MB of
          memory, so they would not stop a real install on a host too small
          to carry GitLab.

    - name: Ask the upgrade path to move GitLab backwards
      block:
        - name: Point gitlab_version at the release the instance came from
          ansible.builtin.include_role:
            name: gitlab
            tasks_from: upgrade.yml
          vars:
            gitlab_upgrade_enabled: true
            gitlab_version: "{{ gitlab_test_initial_version }}"

        - name: Record that the upgrade path accepted the downgrade
          ansible.builtin.set_fact:
            gitlab_test_downgrade_refused: false
      rescue:
        - name: Record that the upgrade path refused the downgrade
          ansible.builtin.set_fact:
            gitlab_test_downgrade_refused: true

    - name: Assert the upgrade path refuses a downgrade
      ansible.builtin.assert:
        that:
          - gitlab_test_downgrade_refused | bool
        fail_msg: >-
          The upgrade path accepted a move from
          {{ gitlab_test_target_version }} back to
          {{ gitlab_test_initial_version }}. GitLab cannot be downgraded: the
          migrations the newer release ran have already changed the schema.
