---
# Builds a minimal single-node cluster with the infrastructure role, then
# exercises this role on it: a Deployment with a ConfigMap, a Secret and an
# Ingress, a StatefulSet with a volume claim template, a custom NetworkPolicy,
# and finally removing one application again with state=absent.
dependency:
  name: galaxy
driver:
  name: vagrant
  parallel: false
  provider:
    name: virtualbox
platforms:
  - name: k8s-app-single
    box: bento/ubuntu-24.04
    memory: 3072
    cpus: 2
    groups:
      - k8s_control_plane
    interfaces:
      - network_name: private_network
        ip: 10.10.24.11
    instance_raw_config_args:
      - "vm.boot_timeout = 600"
    config_options:
      ssh.insert_key: false
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  playbooks:
    prepare: ../../../k3s/molecule/resources/prepare.yml
  inventory:
    # The cluster settings live here rather than in a group_vars file: this is
    # the k3s_app role's directory, and everything in it is expected to
    # carry a k3s_app_ prefix. The applications themselves are in
    # converge.yml, where they do.
    host_vars:
      k8s-app-single:
        k3s_test_subnet_prefix: "10.10.24"
        k3s_token: "molecule-test-token-not-a-real-secret-0123456789"
        k3s_preflight_min_cpu: 2
        k3s_preflight_min_memory_mb: 1024
        k3s_preflight_min_disk_free_mb: 4096
        # Not needed to test application deployment, and the cluster scenarios
        # already cover it.
        k3s_cert_manager_enabled: false
        k3s_metallb_address_pools:
          - name: default
            addresses:
              - "10.10.24.100-10.10.24.110"
        k3s_traefik_loadbalancer_ip: "10.10.24.100"
        # This scenario checks the applications itself, in verify.yml.
        k3s_validate_ingress_hosts: []
verifier:
  name: ansible
ansible:
  cfg:
    ssh_connection:
      retries: 5
    defaults:
      timeout: 60
