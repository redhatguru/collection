---
# The package's post-install script creates the gitlab-runner account and
# installs and starts the service, so everything below this file assumes both.

- name: "DEBIAN | Collect the versions of the packages installed on this host"
  ansible.builtin.package_facts:
    manager: apt

- name: "ALL | Record which runner release this host already has, if any"
  ansible.builtin.set_fact:
    gitlab_runner_installed_version: >-
      {{ (ansible_facts['packages'][gitlab_runner_package_name] | default([]) | first | default({})).version | default('') }}

- name: "DEBIAN | Ensure GitLab Runner is installed at the requested release"
  ansible.builtin.apt:
    name: "{{ gitlab_runner_package_name }}{{ ('=' ~ gitlab_runner_version) if gitlab_runner_version | length > 0 else '' }}"
    state: present
    allow_change_held_packages: true
    update_cache: true
    cache_valid_time: 3600
  become: true
  notify: "ALL | Restart the runner so it picks up its configuration"

# unattended-upgrades would otherwise move the runner to a release your
# pipelines have not seen, mid-week, without anyone asking for it.
- name: "DEBIAN | Ensure the runner package is {{ 'held at its installed release' if gitlab_runner_package_hold | bool else 'not held' }}"
  ansible.builtin.dpkg_selections:
    name: "{{ gitlab_runner_package_name }}"
    selection: "{{ 'hold' if gitlab_runner_package_hold | bool else 'install' }}"
  become: true
