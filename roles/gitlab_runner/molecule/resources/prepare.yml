---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for the instance to become truly reachable over SSH
      ansible.builtin.wait_for_connection:
        delay: 5
        sleep: 5
        timeout: 300

    - name: Gather system info
      ansible.builtin.raw: uname
      register: gitlab_runner_test_uname
      changed_when: false
      failed_when: false

    - name: Bootstrap python for Ansible
      ansible.builtin.raw: |
        command -v python3 python || (
        command -v apk >/dev/null && sudo apk add --no-progress --update python3 ||
        (test -e /usr/bin/dnf && sudo dnf install -y python3) ||
        (test -e /usr/bin/apt && (apt -y update && apt install -y python3-minimal)) ||
        (test -e /usr/bin/yum && sudo yum -y -qq install python3) ||
        echo "Warning: Python not bootstrapped due to unknown platform."
        )
      become: true
      changed_when: false
      when: gitlab_runner_test_uname.rc == 0 and gitlab_runner_test_uname.stdout | trim == "Linux"

    # Both VMs have to resolve the name in GitLab's certificate: GitLab's own
    # preflight checks it, and the runner would otherwise reach a certificate
    # that does not match the address it dialled.
    - name: Resolve the GitLab host name on both instances
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ gitlab_runner_test_gitlab_ip }} {{ gitlab_runner_test_hostname }}"
        regexp: " {{ gitlab_runner_test_hostname | regex_escape }}$"
        state: present
      become: true

- name: Give the GitLab host the swap its requirements ask for
  hosts: gitlab_servers
  gather_facts: false
  tasks:
    # The box ships without swap and GitLab's preflight checks require it —
    # correctly, because the first reconfigure is where a host with no swap
    # gets its Puma workers killed by the OOM reaper.
    - name: Create the swap file
      ansible.builtin.command:
        argv: [fallocate, -l, "2G", /swapfile]
        creates: /swapfile
      become: true

    - name: Ensure the swap file is readable by root only
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"
      become: true

    - name: Check whether the swap file is already in use
      ansible.builtin.command:
        argv: [swapon, --show=NAME, --noheadings]
      register: gitlab_runner_test_active_swap
      changed_when: false

    - name: Format the swap file
      ansible.builtin.command:
        argv: [mkswap, /swapfile]
      become: true
      changed_when: true
      when: "'/swapfile' not in gitlab_runner_test_active_swap.stdout"

    - name: Ensure the swap file is activated at boot
      ansible.posix.mount:
        path: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present
      become: true

    - name: Activate the swap file for this boot
      ansible.builtin.command:
        argv: [swapon, --all]
      become: true
      changed_when: true
      when: "'/swapfile' not in gitlab_runner_test_active_swap.stdout"
