---
# Two VMs: a GitLab to register against, and the runner itself. Registration
# is the whole point of this role, and it cannot be tested without a real
# GitLab — a mocked API would prove only that the role can talk to a mock.
#
# The GitLab is deliberately built with https and a self-signed certificate,
# because that is the configuration where a runner fails in the least obvious
# way: the certificate has to reach the runner, or every call it makes is
# refused. The scenario proves the whole chain instead of assuming it.
#
# It costs what a GitLab install costs — reckon on an hour.
dependency:
  name: galaxy
driver:
  name: vagrant
  parallel: false
  provider:
    name: virtualbox
platforms:
  - name: gitlab-server
    box: bento/ubuntu-24.04
    memory: 8192
    cpus: 4
    groups:
      - gitlab_servers
    interfaces:
      - network_name: private_network
        ip: 10.10.32.11
    instance_raw_config_args:
      - "vm.boot_timeout = 600"
    config_options:
      ssh.insert_key: false
  - name: gitlab-runner
    box: bento/ubuntu-24.04
    memory: 2048
    cpus: 2
    groups:
      - gitlab_runners
    interfaces:
      - network_name: private_network
        ip: 10.10.32.21
    instance_raw_config_args:
      - "vm.boot_timeout = 600"
    config_options:
      ssh.insert_key: false
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  playbooks:
    prepare: ../resources/prepare.yml
    converge: ../resources/converge.yml
    verify: ../resources/verify.yml
  inventory:
    links:
      group_vars: ../resources/group_vars
verifier:
  name: ansible
ansible:
  cfg:
    ssh_connection:
      retries: 5
    defaults:
      timeout: 60
