---
- name: Detect each host's private-network interface
  hosts: all
  tasks:
    - name: Detect the private-network interface
      ansible.builtin.set_fact:
        pxeboot_test_interface: >-
          {{ (ansible_facts.interfaces
              | map('extract', ansible_facts)
              | selectattr('ipv4', 'defined')
              | selectattr('ipv4.address', 'match', '^' + pxeboot_test_subnet_prefix + '\.')
              | map(attribute='device')
              | first) }}

- name: Deploy the PXE boot server
  hosts: all
  become: true
  vars:
    pxeboot_interface: "{{ pxeboot_test_interface }}"
    pxeboot_dhcp_proxy_address: "{{ pxeboot_test_subnet_prefix }}.50"
  tasks:
    - name: Include pxeboot role
      ansible.builtin.include_role:
        name: pxeboot
