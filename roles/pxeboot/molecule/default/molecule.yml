---
dependency:
  name: galaxy
driver:
  name: vagrant
  parallel: false
  provider:
    name: virtualbox
platforms:
  - name: ubuntu2404
    box: bento/ubuntu-24.04
    memory: 1024
    cpus: 1
    interfaces:
      - network_name: private_network
        ip: 10.10.18.11
    instance_raw_config_args:
      - "vm.boot_timeout = 600"
    config_options:
      ssh.insert_key: false
  - name: rockylinux9
    box: bento/rockylinux-9
    memory: 1024
    cpus: 1
    interfaces:
      - network_name: private_network
        ip: 10.10.19.11
    instance_raw_config_args:
      - "vm.boot_timeout = 600"
    config_options:
      ssh.insert_key: false
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  playbooks:
    prepare: prepare.yml
  inventory:
    host_vars:
      ubuntu2404:
        pxeboot_test_subnet_prefix: "10.10.18"
      rockylinux9:
        pxeboot_test_subnet_prefix: "10.10.19"
verifier:
  name: ansible
ansible:
  cfg:
    ssh_connection:
      retries: 5
    defaults:
      timeout: 30
