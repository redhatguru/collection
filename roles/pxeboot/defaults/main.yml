---
# defaults file for pxeboot

# Network interface dnsmasq listens for DHCP-proxy and/or TFTP requests on.
pxeboot_interface: "{{ ansible_default_ipv4.interface }}"

# Whether this host should also run dnsmasq's proxy-DHCP service. It never
# hands out IP leases itself — only PXE-specific information — so it's
# safe to run alongside an existing DHCP server on the same network. Set
# to false if you already run your own DHCP server and would rather
# configure PXE booting there directly (see the report at the end of this
# role for exactly which settings to add to it); this host then only
# serves TFTP.
pxeboot_dhcp_proxy_enabled: true

# An address within the subnet PXE clients boot from — dnsmasq's
# --dhcp-range=<addr>,proxy only needs one address to identify which
# directly-connected subnet to answer PXE requests on (it auto-detects
# the netmask from the interface). Must be set when
# pxeboot_dhcp_proxy_enabled is true.
pxeboot_dhcp_proxy_address: ""

# Where boot files (bootloader, menu config, boot images) are served from
# via TFTP.
pxeboot_tftp_root: /var/lib/tftpboot

# Memtest86+ release fetched from memtest.org, and its published SHA256
# checksum (from https://www.memtest.org/download/v<version>/sha256sum.txt)
# — verified against the actual upstream binaries.zip, not taken on faith.
pxeboot_memtest_version: "8.10"
pxeboot_memtest_checksum: "sha256:7e6c5162cb84ab959aeb9d13c9cfd6976b0dec3b34936b73820b20c55eb26c29"

# Open the host firewall for DHCP-proxy (67, 4011) and TFTP (69) traffic.
pxeboot_firewall_enabled: true
