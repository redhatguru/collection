---
- name: "ALL | Ensure nginx is installed"
  ansible.builtin.package:
    name: nginx
    state: present
  become: true

- name: "ALL | Template the nginx configuration to serve the TFTP root over HTTP"
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    validate: "nginx -t -c %s"
  become: true
  notify: "ALL | Restart nginx"

- name: "ALL | Ensure nginx is enabled and running"
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
  become: true
