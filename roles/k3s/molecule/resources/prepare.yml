---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for the instance to become truly reachable over SSH
      ansible.builtin.wait_for_connection:
        delay: 5
        sleep: 5
        timeout: 300

    - name: Gather system info
      ansible.builtin.raw: uname
      register: k3s_raw_uname
      changed_when: false
      failed_when: false

    - name: Bootstrap python for Ansible
      ansible.builtin.raw: |
        command -v python3 python || (
        command -v apk >/dev/null && sudo apk add --no-progress --update python3 ||
        (test -e /usr/bin/dnf && sudo dnf install -y python3) ||
        (test -e /usr/bin/apt && (apt -y update && apt install -y python3-minimal)) ||
        (test -e /usr/bin/yum && sudo yum -y -qq install python3) ||
        echo "Warning: Python not bootstrapped due to unknown platform."
        )
      become: true
      changed_when: false
      when: k3s_raw_uname.rc == 0 and k3s_raw_uname.stdout | trim == "Linux"
