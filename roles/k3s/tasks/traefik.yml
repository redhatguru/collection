---
- name: "ALL | Ensure the Traefik chart repository is known to Helm"
  kubernetes.core.helm_repository:
    name: "{{ k3s_traefik_chart_repo_name }}"
    repo_url: "{{ k3s_traefik_chart_repo_url }}"
    binary_path: "{{ k3s_helm_binary }}"
  become: true

- name: "ALL | Ensure the Traefik Helm values are on the bootstrap node"
  ansible.builtin.template:
    src: traefik-values.yaml.j2
    dest: "{{ k3s_config_dir }}/traefik-values.yaml"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: "ALL | Ensure Traefik is installed and up to date"
  kubernetes.core.helm:
    name: traefik
    chart_ref: "{{ k3s_traefik_chart_ref }}"
    chart_version: "{{ k3s_traefik_chart_version | default(omit, true) }}"
    release_namespace: "{{ k3s_traefik_namespace }}"
    create_namespace: true
    values_files:
      - "{{ k3s_config_dir }}/traefik-values.yaml"
    kubeconfig: "{{ k3s_kubeconfig }}"
    binary_path: "{{ k3s_helm_binary }}"
    wait: true
    wait_timeout: "{{ k3s_wait_timeout }}s"
  become: true

- name: "ALL | Wait for the ingress to be given an external address"
  ansible.builtin.command:
    argv:
      - "{{ k3s_binary }}"
      - kubectl
      - get
      - service
      - traefik
      - -n
      - "{{ k3s_traefik_namespace }}"
      - -o
      - "jsonpath={.status.loadBalancer.ingress[0].ip}"
  environment:
    KUBECONFIG: "{{ k3s_kubeconfig }}"
  become: true
  register: k3s_traefik_service_address
  changed_when: false
  failed_when: false
  retries: 30
  delay: 5
  until: k3s_traefik_service_address.stdout | default('') | length > 0

- name: "ALL | Record the address the ingress hostnames have to point at"
  ansible.builtin.set_fact:
    k3s_ingress_address: "{{ k3s_traefik_service_address.stdout | trim }}"
