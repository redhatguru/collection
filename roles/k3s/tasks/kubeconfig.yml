---
# K3s writes its kubeconfig with mode 0600 and a server URL of 127.0.0.1.
# Rather than loosening that to 0644 — which would make a cluster-admin
# credential readable by every account on the node — the role installs a
# private copy for one named user, with the server URL rewritten to an address
# that is in the API server certificate.

- name: "ALL | Look up the home directory of the kubeconfig user"
  ansible.builtin.getent:
    database: passwd
    key: "{{ k3s_kubeconfig_user }}"
  when: k3s_kubeconfig_user | length > 0

- name: "ALL | Read the kubeconfig K3s generated on this node"
  ansible.builtin.slurp:
    src: "{{ k3s_kubeconfig }}"
  become: true
  register: k3s_kubeconfig_generated
  no_log: true
  when: k3s_kubeconfig_user | length > 0

- name: "ALL | Ensure the kubeconfig user has a .kube directory"
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_home }}/.kube"
    state: directory
    owner: "{{ k3s_kubeconfig_user }}"
    mode: "0700"
  become: true
  when: k3s_kubeconfig_user | length > 0

- name: "ALL | Install the kubeconfig for the administrative user"
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig_rewritten }}"
    dest: "{{ k3s_kubeconfig_home }}/.kube/config"
    owner: "{{ k3s_kubeconfig_user }}"
    mode: "{{ k3s_kubeconfig_mode }}"
  become: true
  no_log: true
  when: k3s_kubeconfig_user | length > 0

- name: "ALL | Fetch the kubeconfig back to the Ansible controller"
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig_rewritten }}"
    dest: "{{ k3s_kubeconfig_fetch_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
  when:
    - k3s_kubeconfig_fetch | bool
    - k3s_kubeconfig_fetch_path | length > 0
    - k3s_is_init_host | bool
