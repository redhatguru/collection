---
# Runs once, on the bootstrap node, which is the only host that is guaranteed
# to have both a kubeconfig and Helm.

- name: "ALL | Ensure the MetalLB chart repository is known to Helm"
  kubernetes.core.helm_repository:
    name: "{{ k3s_metallb_chart_repo_name }}"
    repo_url: "{{ k3s_metallb_chart_repo_url }}"
    binary_path: "{{ k3s_helm_binary }}"
  become: true

- name: "ALL | Ensure the MetalLB Helm values are on the bootstrap node"
  ansible.builtin.template:
    src: metallb-values.yaml.j2
    dest: "{{ k3s_config_dir }}/metallb-values.yaml"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: "ALL | Ensure MetalLB is installed and up to date"
  kubernetes.core.helm:
    name: metallb
    chart_ref: "{{ k3s_metallb_chart_ref }}"
    chart_version: "{{ k3s_metallb_chart_version | default(omit, true) }}"
    release_namespace: "{{ k3s_metallb_namespace }}"
    create_namespace: true
    values_files:
      - "{{ k3s_config_dir }}/metallb-values.yaml"
    kubeconfig: "{{ k3s_kubeconfig }}"
    binary_path: "{{ k3s_helm_binary }}"
    wait: true
    wait_timeout: "{{ k3s_wait_timeout }}s"
  become: true

# Written after the chart is installed so the custom resource definitions the
# pools depend on already exist.
- name: "ALL | Ensure the MetalLB address pools and advertisements are declared"
  ansible.builtin.template:
    src: metallb-pools.yaml.j2
    dest: "{{ k3s_manifests_dir }}/metallb-pools.yaml"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: "ALL | Wait for MetalLB to accept the address pools"
  ansible.builtin.command:
    argv:
      - "{{ k3s_binary }}"
      - kubectl
      - get
      - ipaddresspool
      - "{{ (k3s_metallb_address_pools | first).name }}"
      - -n
      - "{{ k3s_metallb_namespace }}"
      - -o
      - "jsonpath={.metadata.name}"
  environment:
    KUBECONFIG: "{{ k3s_kubeconfig }}"
  become: true
  register: k3s_metallb_pool_state
  changed_when: false
  failed_when: false
  retries: 30
  delay: 5
  until: k3s_metallb_pool_state.stdout | default('') | length > 0
