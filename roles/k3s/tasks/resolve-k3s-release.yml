---
# Included by both k3s-config.yml and upgrade.yml, so a normal run and an
# upgrade run resolve the target release in exactly the same way.

- name: "ALL | Resolve the requested K3s release channel to a concrete version"
  ansible.builtin.uri:
    url: "{{ k3s_channel_url }}/{{ k3s_channel }}"
    follow_redirects: none
    status_code: [301, 302]
  register: k3s_channel_response
  changed_when: false
  run_once: true
  delegate_to: "{{ k3s_init_host }}"
  when: k3s_version | length == 0

- name: "ALL | Settle on the K3s release every node installs"
  ansible.builtin.set_fact:
    k3s_release: >-
      {{ k3s_version
         if k3s_version | length > 0
         else k3s_channel_response.location | basename }}
  run_once: true

- name: "ALL | Ensure the resolved K3s release looks like a real release"
  ansible.builtin.assert:
    that:
      - k3s_release is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
    fail_msg: >-
      Resolved K3s release '{{ k3s_release }}' from channel
      '{{ k3s_channel }}' does not look like a K3s version. Pin
      k3s_version instead, for example 'v1.31.5+k3s1'.
    quiet: true
  run_once: true
